name: Markdown

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  validate:
    name: Validate Markdown, OKF, Skills, and examples
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install validation dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Run validator tests
        run: python -m unittest discover -s tests

      - name: Validate Markdown links
        run: python scripts/validate_markdown.py

      - name: Validate OKF bundles
        run: python scripts/validate_okf.py

      - name: Validate Skills
        run: python scripts/validate_skills.py

      - name: Check example Skill copies
        run: python scripts/sync_examples.py --check
